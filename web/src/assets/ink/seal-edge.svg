<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" preserveAspectRatio="none">
  <!-- The seal's pressed edge without the worn flecks, for a seal that holds
       words someone has to read (the agent's name tag). Mask: alpha only. -->
  <defs>
    <filter id="press" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.2" numOctaves="2" seed="5" result="edge"/>
      <feDisplacementMap in="SourceGraphic" in2="edge" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="2" y="3" width="96" height="34" rx="2" fill="#000" filter="url(#press)"/>
</svg>
