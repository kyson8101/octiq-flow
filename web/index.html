<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1c1e" />

    <!-- Relative hrefs, like the asset URLs: `base: "./"` in vite.config.ts
         keeps the bundle working wherever it is mounted, and these follow the
         same rule so nothing depends on the page sitting at the root. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./icon-32.png" sizes="32x32" />

    <!-- Reached from a phone through a tunnel, so it is meant to be added to a
         home screen. A tab cannot be told to shrink its own toolbar, so the
         home screen is the only way the address bar comes off the screen.

         What is DELIBERATELY absent is `apple-mobile-web-app-capable`. It is
         the obvious tag to reach for and it is the wrong one here: on iOS it
         forces `standalone` and outranks the manifest, which buys a chromeless
         window at the price of every navigation control — no back, and above
         all no reload, on an app whose whole job is a live view of a machine
         at the end of a tunnel. The manifest asks for `minimal-ui` instead:
         same missing address bar, native back/share/reload kept.

         iOS reads none of the manifest for the ICON: it wants its own, and it
         composites transparency onto black, so this one is already flattened
         onto the app's own background. The viewport stays `viewport-fit=cover`
         and the layout keeps padding with `env(safe-area-inset-*)` either way.
         -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OctiqFlow" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>OctiqFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
