<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1c1e" />

    <!-- Relative hrefs, like the asset URLs: `base: "./"` in vite.config.ts
         keeps the bundle working wherever it is mounted, and these follow the
         same rule so nothing depends on the page sitting at the root. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./icon-32.png" sizes="32x32" />

    <!-- Reached from a phone through a tunnel, so it is meant to be added to a
         home screen. A tab cannot be told to shrink its own toolbar, so the
         home screen is the only way the address bar comes off the screen.

         `standalone` is chromeless: no address bar, and no navigation controls
         either. `minimal-ui` is the mode that keeps native back/reload, and it
         was tried here — iOS did not give the controls, so the reload lives in
         our own top bar instead (`InstalledReload`). Do not reach for
         `minimal-ui` again without testing it on a real phone; and note that
         iOS caches the manifest at INSTALL time, so testing it means deleting
         the home-screen icon and adding it again, not reloading.

         The status-bar-style is not part of that choice and must not be
         removed with it: it is what puts the page UNDER the status bar. The
         top bar is sized `48px + env(safe-area-inset-top)` (styles.css), so
         dropping it moves the inset out from under the layout and the bar
         comes out wrong.

         iOS reads none of the manifest for the ICON: it wants its own, and it
         composites transparency onto black, so this one is already flattened
         onto the app's own background. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The same thing, un-prefixed. Chrome/Android warns on the Apple name
         alone, and reads this one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OctiqFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>OctiqFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
