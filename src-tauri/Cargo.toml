[package]
name = "octiq-flow"
version = "0.1.2"
description = "Agent workflow orchestrator: run agents in real terminals, driven from a browser"
authors = ["kyson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the binary's.
name = "octiq_flow_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
# Fs watcher behind the sidebar's live git status (git_watch.rs).
notify = "8"
# Encodes the PowerShell process-snapshot script as `-EncodedCommand` on Windows
# (agents.rs), and reads an image off disk as a content block (agent_chat.rs).
base64 = "0.22"
# Remote access (web.rs): serve the client and bridge a browser to this
# machine's backend over one WebSocket, so the backend can run on a machine that
# stays on while you drive it from a laptop or a phone.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
futures-util = "0.3"
# Cloudflare Access sign-in (access.rs): verify the JWT Access puts on every
# request it lets through, so a browser that has signed in needs no token of
# ours. `ureq` only ever fetches Cloudflare's public keys — a blocking call made
# rarely and cached — which is why it is here instead of a full async client.
jsonwebtoken = "9"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Web push (push.rs): a notification that arrives with nothing open. `p256`
# signs the VAPID claim that identifies this server to the push service.
web-push = { version = "0.11.0", default-features = false }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

# The server ships as one stripped binary, so the only things that matter here
# are size and speed — not incremental rebuild time (card 20).
[profile.release]
# Cross-crate inlining and dead-code elimination across the whole dependency
# graph. This is where most of the size win comes from, and it is why
# codegen-units drops to 1: more units means less for LTO to see at once.
lto = true
codegen-units = 1
# ~27k symbols shipped in the binary and none of them are read at runtime.
strip = "symbols"

# NOT set, deliberately:
#
#   panic = "abort"  — the card asked for it; it is wrong for this app. Each PTY
#     runs its own reader and emitter thread, and a panic in one of them
#     currently kills only that terminal. Under `abort` a single decode bug in
#     one background terminal takes the whole server down with it, dropping every
#     other terminal's session. Trading the user's live work for a few hundred KB
#     is a bad deal.
#
#   opt-level = "s"  — the card suggested trying it, with "keep 3 if terminal
#     throughput regresses". The PTY read/decode/scan path is the app's hot
#     loop, and there is no benchmark here to prove it does not regress, so the
#     default (3) stands. Revisit with a measurement, not a guess.


[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
